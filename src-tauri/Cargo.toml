[package]
name = "hextech-skin-client"
version = "0.1.1"
description = "High-Performance 100% Portable League of Legends Custom Skin Client"
authors = ["Hextech Systems Architect"]
edition = "2021"

[lib]
name = "hextech_skin_client_lib"
crate-type = ["staticlib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "cookies"] }
camino = { version = "1.1", features = ["serde1"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
percent-encoding = "2.3"
urlencoding = "2.1"
base64 = "0.22"
futures-util = "0.3"

# Official LeagueToolkit crates
ltk_mod_core = { git = "https://github.com/LeagueToolkit/league-mod" }
ltk_fantome = { git = "https://github.com/LeagueToolkit/league-mod" }
ltk_overlay = { git = "https://github.com/LeagueToolkit/league-mod" }
ltk_game_index = { git = "https://github.com/LeagueToolkit/league-mod" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
